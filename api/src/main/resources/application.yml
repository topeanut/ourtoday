spring:
  application:
    name: api

  datasource:
    url: jdbc:postgresql://localhost:5432/ourtoday
    username: ourtoday
    password: ourtoday_dev_pw
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  jwt:
    secret: ${JWT_SECRET:dev_only_change_me_minimum_32_chars_for_hs256_algorithm_padding}
    access-token-validity-ms: 1800000   # 30분
    refresh-token-validity-ms: 1209600000   # 14일
  oauth2:
    # 로그인 성공 후 프론트 주소 (예: https://ourtoday.vercel.app/auth/callback). 비우면 JSON 응답
    success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:}

server:
  port: 8080