spring:
  application:
    name: api

  datasource:
    url: jdbc:postgresql://localhost:5432/ourtoday
    username: ourtoday
    password: ourtoday_dev_pw
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  data:
    web:
      pageable:
        max-page-size: 50

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  jwt:
    secret: ${JWT_SECRET:dev_only_change_me_minimum_32_chars_for_hs256_algorithm_padding}
    access-token-validity-ms: 1800000   # 30분
    refresh-token-validity-ms: 2592000000   # 30일
  storage:
    # S3 호환 저장소 (운영: Oracle Object Storage). endpoint 비우면 이미지 기능 비활성
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:auto}
    bucket: ${STORAGE_BUCKET:ourtoday-images}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    upload-url-ttl: 10m
    download-url-ttl: 1h
  apple:
    # Sign in with Apple. 키(.p8)가 없어도 로그인은 되지만, 탈퇴 때 Apple 연결 철회가 안 됨
    team-id: ${APPLE_TEAM_ID:NRJ8TYHKJM}
    key-id: ${APPLE_KEY_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}
    client-ids: ${APPLE_CLIENT_IDS:app.ourtoday,app.ourtoday.web}
    web-client-id: ${APPLE_WEB_CLIENT_ID:app.ourtoday.web}
    web-redirect-uri: ${APPLE_WEB_REDIRECT_URI:https://ourtoday.vercel.app/login/oauth2/code/apple}
  oauth2:
    # 로그인 성공 후 프론트 주소 (예: https://ourtoday.vercel.app/auth/callback). 비우면 JSON 응답
    success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:}

  push:
    # Firebase 서비스 계정 JSON 을 base64 로 인코딩한 값. 비우면 푸시 발송 비활성(로그만)
    firebase-service-account: ${FIREBASE_SERVICE_ACCOUNT:}
    async: true
    schedule: true

server:
  port: 8080