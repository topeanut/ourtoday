# 테스트 전용 — 로컬 Postgres 없이 H2(PostgreSQL 모드) 로 실행
spring:
  datasource:
    url: jdbc:h2:mem:ourtoday;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

  data:
    web:
      pageable:
        max-page-size: 50

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-client-id
            client-secret: test-client-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  jwt:
    secret: test_secret_minimum_32_chars_for_hs256_algorithm_padding_xxxxxxxx
    access-token-validity-ms: 1800000
    refresh-token-validity-ms: 1209600000
  storage:
    endpoint:
    region: auto
    bucket: test-bucket
    upload-url-ttl: 10m
    download-url-ttl: 1h
  apple:
    team-id: TESTTEAM00
    key-id:
    private-key:
    client-ids: app.ourtoday,app.ourtoday.web
    web-client-id: app.ourtoday.web
    web-redirect-uri: https://ourtoday.vercel.app/login/oauth2/code/apple
  oauth2:
    success-redirect-uri:
