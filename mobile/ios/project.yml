name: OurToday
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  OurToday:
    type: application
    platform: iOS
    sources:
      - OurToday
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ourtoday
        PRODUCT_NAME: OurToday
        INFOPLIST_FILE: OurToday/Info.plist
        CODE_SIGN_ENTITLEMENTS: OurToday/OurToday.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: NRJ8TYHKJM
        # 시작 URL (Info.plist 의 OurTodayStartURL 로 전달)
        OURTODAY_START_URL: https://ourtoday.vercel.app/
schemes:
  OurToday:
    build:
      targets:
        OurToday: all
    run:
      config: Debug
    archive:
      config: Release
