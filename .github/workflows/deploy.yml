# main 에 push → 테스트 → jar 빌드 → 이미지(GHCR) 푸시
# 서버는 2분마다 새 이미지를 확인해서 스스로 교체 (ops/deploy-pull.sh). 서버로 들어오는 SSH 불필요
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/buildup2026/ourtoday-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test & build jar
        working-directory: api
        run: ./gradlew test bootJar --no-daemon

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
